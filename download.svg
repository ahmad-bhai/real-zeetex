<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">

  <!-- Background Circle Glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a00ff" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"></stop>
    </radialGradient>
  </defs>

  <circle cx="400" cy="400" r="350" fill="url(#glow)"></circle>

  <!-- Magician Hat -->
  <rect x="330" y="180" width="140" height="120" rx="20" fill="#0a0a0a"></rect>
  <rect x="310" y="280" width="180" height="30" rx="10" fill="#0a0a0a"></rect>
  <rect x="330" y="230" width="140" height="20" fill="#ff004c"></rect>

  <!-- Face -->
  <circle cx="400" cy="330" r="70" fill="#f2c6a0"></circle>
  
  <!-- Eyes -->
  <circle cx="370" cy="320" r="8" fill="#000"></circle>
  <circle cx="430" cy="320" r="8" fill="#000"></circle>

  <!-- Body -->
  <path d="M300 450 Q400 350 500 450 L500 600 L300 600 Z" fill="#111"></path>

  <!-- Bow -->
  <polygon points="380,420 350,450 380,460" fill="#ff004c"></polygon>
  <polygon points="420,420 450,450 420,460" fill="#ff004c"></polygon>

  <!-- Wand -->
  <line x1="500" y1="300" x2="600" y2="200" stroke="#ffffff" stroke-width="6"></line>
  <circle cx="600" cy="200" r="8" fill="#ffffff"></circle>

  <!-- Sparkles -->
  <circle cx="620" cy="180" r="3" fill="#fff"></circle>
  <circle cx="580" cy="220" r="2" fill="#fff"></circle>
  <circle cx="350" cy="250" r="2" fill="#fff"></circle>

  <!-- Text -->
  <text x="400" y="700" text-anchor="middle" font-size="90" font-family="Arial" fill="#ffffff" font-weight="bold">
    MAGIC
  </text>
  <text x="400" y="760" text-anchor="middle" font-size="40" font-family="Arial" fill="#cccccc">
    SCRIPTS
  </text>

</svg>